spring.application.name=inventory-consumer

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# RabbitMQ conexión
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ - módulo location
rabbitmq.exchange.location=location.exchange
rabbitmq.queue.location.create=location.create
rabbitmq.queue.location.update=location.update
rabbitmq.queue.location.patch=location.patch


rabbitmq.routing-key.location.create=location.create
rabbitmq.routing-key.location.update=location.update
rabbitmq.routing-key.location.patch=location.patch
